name: Cross-platform tests
permissions:
  contents: read

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"

# Only keep the latest run for each branch: a new push cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # see https://github.com/actions/runner-images?tab=readme-ov-file#available-images for runner types
        # One runner per OS and architecture, the same ones releases.yml builds on
        # (macos-26 / macos-26-intel only repeated macos-15 / macos-15-intel).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel] # macos-15 is Arm64
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: (macos) install automake and autoconf
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install automake autoconf

      - name: Install stable minimal toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests on latest stable rust
        run: cargo test --features cfitsio-static,examples

      - name: Minimum-specified Rust version works
        run: |
          MIN_RUST=$(grep -m1 "rust-version" Cargo.toml | sed 's|.*\"\(.*\)\"|\1|')
          # Use the rustup on the PATH: on the macOS (Arm64) runners it is not in ~/.cargo/bin
          rustup toolchain install "${MIN_RUST}" --profile minimal
          cargo +${MIN_RUST} test --features cfitsio-static,examples

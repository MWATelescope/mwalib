name: Python tests
permissions:
  contents: read

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # see https://github.com/actions/runner-images?tab=readme-ov-file#available-images for runner types
        os: [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-15,
            macos-15-intel,
            macos-26,
            macos-26-intel,
          ] # macos-26 & 15 are Arm64
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: (macos) install automake and autoconf
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install automake autoconf

      - name: Install stable minimal toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests to generate the test data
        run: |
          echo "Run rust tests to generate test data"
          cargo update
          cargo test --features cfitsio-static,examples

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build mwalib Python module and install dev dependencies
        env:
          MATURIN_PEP517_ARGS: --features=cfitsio-static,examples,python,pyo3/extension-module --strip
        run: uv sync --locked

      - name: Run Python tests
        run: uv run --no-sync pytest
